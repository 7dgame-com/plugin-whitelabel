services:
  plugin-whitelabel-backend:
    image: hkccr.ccs.tencentyun.com/plugins/plugin-whitelabel-backend:publish
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8093"
      DB_HOST: ${WHITELABEL_DB_HOST:?set WHITELABEL_DB_HOST}
      DB_PORT: ${WHITELABEL_DB_PORT:-3306}
      DB_NAME: ${WHITELABEL_DB_NAME:?set WHITELABEL_DB_NAME}
      DB_USER: ${WHITELABEL_DB_USER:?set WHITELABEL_DB_USER}
      DB_PASSWORD: ${WHITELABEL_DB_PASSWORD:?set WHITELABEL_DB_PASSWORD}
      DB_CONNECTION_LIMIT: "10"
      MAIN_API_BASE_URL: ${MAIN_API_BASE_URL:?set MAIN_API_BASE_URL}
      MAIN_API_TIMEOUT_MS: "5000"
      MAIN_FRONTEND_PUBLIC_BASE_URL: https://xrugc.com
      DOMAIN_CATALOG_TIMEOUT_MS: "3000"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.plugin-whitelabel-api.rule=Host(`${WHITELABEL_BACKEND_PUBLIC_HOST:?set WHITELABEL_BACKEND_PUBLIC_HOST}`)"
      - "traefik.http.routers.plugin-whitelabel-api.entrypoints=websecure"
      - "traefik.http.routers.plugin-whitelabel-api.tls=true"
      - "traefik.http.routers.plugin-whitelabel-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.plugin-whitelabel-api.loadbalancer.server.port=8093"

networks:
  proxy:
    external: true
